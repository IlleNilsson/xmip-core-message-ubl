[package]
name = "xmip-core-message-ubl"
version.workspace = true
edition.workspace = true
license.workspace = true
repository = "https://github.com/IlleNilsson/xmip-core-message-ubl"
description = "UBL shape: an XML document in the OASIS UBL 2 namespace, its document type — Invoice, Order — as the announced type. A xmip-core-message technology."
publish.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
# The parent capability's `Shape` (`message::shape`; repository-model.md),
# and the Stream it shapes.
message = { package = "xmip-core-message", git = "https://github.com/IlleNilsson/xmip-core-message", branch = "main" }
stream = { package = "xmip-core-stream", git = "https://github.com/IlleNilsson/xmip-core-stream", branch = "main" }
# UBL is an XML vocabulary: the document is read through the xml shape, and
# only the namespace and the document type are this technology's (ADR-0047).
message_xml = { package = "xmip-core-message-xml", git = "https://github.com/IlleNilsson/xmip-core-message-xml", branch = "main" }

[dev-dependencies]
xcore = { package = "xmip-core", git = "https://github.com/IlleNilsson/xmip-core", branch = "main" }

[lints]
workspace = true
